<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="MobileOptimized" content="width">
<meta name="HandheldFriendly" content="true">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<title>野鸡电竞</title>
<style>
  :root {
    --qq-number: "1094601210";        /* ← 你的 QQ 号 */
    --url-shizuku: "./shizuku.apk";  /* ← SHIZUKU 下载（同目录相对路径） */
    --url-launcher: "./yeji.apk";     /* ← 启动器下载（同目录相对路径） */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #f8f9fa;
    color: #202124;
    min-height: 100vh;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* ---------- 顶部状态条 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
    background: rgba(255,255,255,.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.06);
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .logo {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #1a73e8, #8ab4f8);
    display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(26,115,232,.35);
  }
  .topbar .logo svg { width: 16px; height: 16px; fill: #fff; }
  .topbar .title { font-size: 17px; font-weight: 600; letter-spacing: .2px; }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  /* ---------- 分区 ---------- */
  .section { margin-bottom: 28px; }
  .section-label {
    font-size: 13px; font-weight: 500; color: #5f6368;
    text-transform: uppercase; letter-spacing: 1px;
    margin: 0 6px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(0,0,0,.08), transparent);
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 1px 2px rgba(60,64,67,.08), 0 4px 16px rgba(60,64,67,.06);
    overflow: hidden;
  }

  /* 入场动画 */
  .reveal {
    opacity: 0; transform: translateY(18px);
    transition: opacity .6s cubic-bezier(.2,0,0,1), transform .6s cubic-bezier(.2,0,0,1);
  }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- ④ 产品展示（本地视频） ---------- */
  .video-card video {
    display: block; width: 100%; height: auto; max-height: 72vh;
    background: #000; object-fit: contain;
  }

  /* ---------- ③ 抖音观看 ---------- */
  .douyin-card { padding: 28px 22px 24px; text-align: center; }
  .douyin-icon {
    width: 60px; height: 60px; margin: 0 auto 16px;
    border-radius: 18px; display: grid; place-items: center;
    background: #000;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .douyin-icon svg { width: 28px; height: 28px; fill: #fff; }
  .douyin-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .douyin-sub { font-size: 13px; color: #5f6368; margin-bottom: 22px; }
  .douyin-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: #000; color: #fff;
    font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: transform .12s ease, opacity .2s ease;
  }
  .douyin-btn:active { transform: scale(.97); }
  .douyin-btn svg { width: 18px; height: 18px; fill: #fff; }

  /* ---------- ② 购买卡密 ---------- */
  .buy-card { padding: 26px 22px 24px; text-align: center; }
  .buy-icon {
    width: 60px; height: 60px; margin: 0 auto 16px;
    border-radius: 18px; display: grid; place-items: center;
    background: linear-gradient(135deg, #1a73e8, #4285f4);
    box-shadow: 0 6px 18px rgba(26,115,232,.35);
  }
  .buy-icon svg { width: 30px; height: 30px; fill: #fff; }
  .buy-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .buy-sub { font-size: 13px; color: #5f6368; margin-bottom: 22px; }

  .qq-box {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 26px; border-radius: 16px;
    background: #f1f3f4;
    border: 1px solid transparent;
    cursor: pointer; user-select: none;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  }
  .qq-box:active { transform: scale(.96); }
  .qq-box.copied {
    background: #e6f4ea; border-color: #34a853;
    box-shadow: 0 4px 14px rgba(52,168,83,.25);
  }
  .qq-num { font-size: 26px; font-weight: 700; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; }
  .qq-copy-hint { font-size: 12px; color: #5f6368; display: flex; align-items: center; gap: 5px; }
  .qq-copy-hint svg { width: 14px; height: 14px; fill: #5f6368; }

  .buy-tip { margin-top: 18px; font-size: 12px; color: #9aa0a6; line-height: 1.6; }

  /* ---------- ③ 资源下载 ---------- */
  .dl-wrap { display: flex; flex-direction: column; gap: 14px; padding: 18px; }

  .dl-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 18px 18px; border-radius: 16px;
    background: #fff;
    border: 1px solid rgba(0,0,0,.07);
    box-shadow: 0 1px 3px rgba(60,64,67,.08);
    text-decoration: none; color: #202124;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .dl-btn:active { transform: scale(.98); box-shadow: 0 2px 8px rgba(60,64,67,.12); }

  .dl-icon {
    width: 46px; height: 46px; flex: none; border-radius: 14px;
    display: grid; place-items: center;
  }
  .dl-icon svg { width: 22px; height: 22px; fill: #fff; }
  .dl-icon.shizuku { background: linear-gradient(135deg, #34a853, #188038); }
  .dl-icon.launcher { background: linear-gradient(135deg, #4285f4, #1a73e8); }

  .dl-meta { flex: 1; min-width: 0; }
  .dl-name { font-size: 16px; font-weight: 600; }
  .dl-desc { font-size: 12px; color: #5f6368; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dl-arrow svg { width: 20px; height: 20px; fill: #9aa0a6; transition: transform .2s ease; }
  .dl-btn:active .dl-arrow svg { transform: translateY(2px); }

  /* ---------- 波纹效果（Google 风格） ---------- */
  .ripple { position: absolute; border-radius: 50%; transform: scale(0); pointer-events: none;
    background: rgba(32,33,36,.1); animation: ripple .6s ease-out forwards; }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px);
    background: #323232; color: #fff;
    padding: 12px 22px; border-radius: 24px;
    font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.28);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 100; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 页脚 ---------- */
  .footer {
    text-align: center; color: #9aa0a6; font-size: 12px;
    padding: 10px 0 6px; letter-spacing: .3px;
  }

  /* ---------- 移动端适配（≤600px） ---------- */
  @media (max-width: 600px) {
    body { font-size: 15px; }
    .topbar { padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
    .topbar .title { font-size: 16px; }
    .container { max-width: 100%; padding: 16px 14px 0; }
    .section { margin-bottom: 22px; }
    .section-label { font-size: 12px; margin: 0 4px 10px; }

    .buy-card { padding: 24px 18px 22px; }
    .buy-icon { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 14px; }
    .buy-icon svg { width: 26px; height: 26px; }
    .buy-title { font-size: 17px; }
    .buy-sub { font-size: 13px; margin-bottom: 18px; }
    .qq-box { padding: 14px 22px; gap: 10px; }
    .qq-num { font-size: 24px; letter-spacing: 1px; }
    .buy-tip { font-size: 11px; margin-top: 16px; }

    .dl-wrap { gap: 12px; padding: 14px; }
    .dl-btn { padding: 15px 14px; gap: 12px; }
    .dl-icon { width: 42px; height: 42px; border-radius: 12px; }
    .dl-icon svg { width: 20px; height: 20px; }
    .dl-name { font-size: 15px; }
    .dl-desc { font-size: 11px; }

    .douyin-card { padding: 24px 18px 22px; }
    .douyin-icon { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 14px; }
    .douyin-icon svg { width: 26px; height: 26px; }
    .douyin-title { font-size: 17px; }
    .douyin-sub { font-size: 13px; margin-bottom: 18px; }
    .douyin-btn { padding: 15px; font-size: 15px; border-radius: 14px; }

    .video-card video { max-height: 58vh; }
    .footer { font-size: 11px; }
  }

  /* ---------- 超小屏（≤360px）进一步压缩 ---------- */
  @media (max-width: 360px) {
    .container { padding: 14px 12px 0; }
    .qq-num { font-size: 21px; }
    .buy-card, .douyin-card { padding: 20px 14px 18px; }
    .dl-btn { padding: 13px 12px; }
  }
</style>
</head>
<body>

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
    <div class="title">野鸡电竞</div>
  </header>

  <main class="container">

    <!-- ① 购买卡密 -->
    <section class="section reveal">
      <div class="section-label">购买卡密</div>
      <div class="card buy-card">
        <div class="buy-icon">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-7 9H7v-2h6v2zm4 0h-2v-2h2v2z"/></svg>
        </div>
        <div class="buy-title">购买卡密</div>
        <div class="buy-sub">点击下方 QQ 群号即可一键复制，添加后购买</div>

        <div class="qq-box" id="qqBox" role="button" tabindex="0" aria-label="点击复制 QQ 号">
          <span class="qq-num" id="qqNum"></span>
          <span class="qq-copy-hint">
            <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
            点击复制
          </span>
        </div>

        <p class="buy-tip">卡密激活后永久有效，请勿泄露您的卡密<br>激活遇到问题请联系群管理</p>
      </div>
    </section>

    <!-- ② 资源下载 -->
    <section class="section reveal">
      <div class="section-label">资源下载</div>
      <div class="card dl-wrap">
        <a class="dl-btn" id="btnShizuku" href="./shizuku.apk">
          <span class="dl-icon shizuku">
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
          </span>
          <span class="dl-meta">
            <span class="dl-name">SHIZUKU 下载</span>
            <span class="dl-desc">下载可能有延迟，请耐心等待弹窗</span>
          </span>
          <span class="dl-arrow"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></span>
        </a>

        <a class="dl-btn" id="btnLauncher" href="./yeji.apk">
          <span class="dl-icon launcher">
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
          </span>
          <span class="dl-meta">
            <span class="dl-name">启动器下载</span>
            <span class="dl-desc">下载可能有延迟，请耐心等待弹窗</span>
          </span>
          <span class="dl-arrow"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></span>
        </a>
      </div>
    </section>

    <!-- ③ 抖音观看 -->
    <section class="section reveal">
      <div class="section-label">观看视频</div>
      <div class="card douyin-card">
        <div class="douyin-icon">
          <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        </div>
        <div class="douyin-title">打开抖音观看</div>
        <div class="douyin-sub">点击复制口令，打开抖音 App 即可观看视频</div>
        <button class="douyin-btn" id="douyinBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
          复制抖音口令
        </button>
        <p class="buy-tip">复制后请打开抖音 App 粘贴，即可观看视频</p>
      </div>
    </section>

    <footer class="footer">野鸡 · 官方展示页</footer>

  </main>

  <div class="toast" id="toast"></div>

<script>
  // ===== 配置：只需改这里 =====
  var QQ = "1094601210";
  var DOUYIN_URL = "0.02 复制打开抖音，看看【李世民的作品】那还说啥了 # 用asmr声音记录生活日常 # 三... https://v.douyin.com/5ULQ0y-ykyc/ :3pm Q@x.Fu 08/24 OkP:/";
  // ===========================

  var qqNum = document.getElementById('qqNum');
  qqNum.textContent = QQ;

  // ---------- 复制 QQ ----------
  var qqBox = document.getElementById('qqBox');
  function copyQQ() {
    function done() {
      qqBox.classList.add('copied');
      showToast('已复制，快去添加吧');
      setTimeout(function(){ qqBox.classList.remove('copied'); }, 1600);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(QQ).then(done).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = QQ;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { showToast('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    }
  }
  qqBox.addEventListener('click', copyQQ);
  qqBox.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyQQ(); } });

  // ---------- 直接下载（点击即下载，不跳转） ----------
  // 通过 fetch 抓取文件 → 校验是 APK → 以 blob 形式触发浏览器下载
  function startDownload(url, filename) {
    if (!url) {
      showToast('请先配置正确的下载链接');
      return;
    }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'blob';
    xhr.onload = function () {
      if (xhr.status !== 200) { showToast('下载失败：无法访问下载源（' + xhr.status + '）'); return; }
      var blob = xhr.response;
      // 校验 APK/ZIP 魔数（PK\x03\x04），避免把网页误存成 .apk
      var fr = new FileReader();
      fr.onload = function (e) {
        var head = new Uint8Array(e.target.result);
        var ok = head.length >= 4 && head[0] === 0x50 && head[1] === 0x4B && head[2] === 0x03 && head[3] === 0x04;
        if (!ok) { showToast('下载源异常：未获取到 APK 文件'); return; }
        var objUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objUrl; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(objUrl); }, 3000);
        showToast('正在下载 ' + filename);
      };
      fr.readAsArrayBuffer(blob.slice(0, 4));
    };
    xhr.onerror = function () {
      // 跨域被拦截等场景：回退为隐藏 <a download> 触发浏览器原生下载
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      showToast('正在下载 ' + filename);
    };
    xhr.send();
  }

  function bindDownload(id, filename) {
    var btn = document.getElementById(id);
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      startDownload(btn.getAttribute('href'), filename);
    });
  }
  bindDownload('btnShizuku', 'shizuku.apk');
  bindDownload('btnLauncher', 'yeji.apk');

  // ---------- Toast ----------
  var toast = document.getElementById('toast'), toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  // ---------- 复制抖音口令（只复制，不跳转） ----------
  var douyinBtn = document.getElementById('douyinBtn');
  function openDouyin() {
    if (!DOUYIN_URL) { showToast('请先配置抖音链接'); return; }
    function done() {
      showToast('已复制，打开抖音 App 粘贴即可观看');
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = DOUYIN_URL;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { showToast('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(DOUYIN_URL).then(done).catch(fallback);
    } else {
      fallback();
    }
  }
  douyinBtn.addEventListener('click', openDouyin);

  // ---------- 波纹效果 ----------
  document.addEventListener('click', function(e){
    var t = e.target.closest('.dl-btn, .qq-box');
    if (!t) return;
    var r = t.getBoundingClientRect();
    var d = Math.max(r.width, r.height);
    var s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (e.clientX - r.left - d/2) + 'px';
    s.style.top  = (e.clientY - r.top  - d/2) + 'px';
    t.appendChild(s);
    setTimeout(function(){ s.remove(); }, 600);
  });

  // ---------- 入场动画 ----------
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
</script>
</body>
</html>
