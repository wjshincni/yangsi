<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>野鸡电竞</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--ink:#1a1d26;--sub:#7a8190;--line:#e9edf2;--green:#07c160;--blue:#1677ff;--warn:#faad14;--bg:#f5f6f8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
section{scroll-margin-top:64px}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

/* ========== 首屏 hero：logo 常驻，Q弹入场 + 双按钮 ========== */
.hero{min-height:100vh;background:radial-gradient(circle at 50% 38%,#1e2637 0%,#0d1117 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
.hero .logo{width:148px;height:148px;border-radius:26px;object-fit:cover;box-shadow:0 24px 70px rgba(0,0,0,.55);opacity:0;animation:pop .92s cubic-bezier(.22,.9,.32,1.18) forwards;transform-origin:center}
@keyframes pop{
  0%{transform:scale(.4);opacity:0}
  46%{transform:scale(1.18);opacity:1}
  66%{transform:scale(.9)}
  84%{transform:scale(1.07)}
  100%{transform:scale(1);opacity:1}
}
.hero .cta{display:flex;gap:14px;margin-top:32px;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.hero.show-cta .cta{opacity:1;transform:none}
.hero .btn{min-width:132px;padding:13px 0;border:none;border-radius:26px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s}
.hero .btn:active{transform:scale(.96)}
.btn-buy{background:linear-gradient(135deg,#07c160,#0fb97a);color:#fff;box-shadow:0 10px 26px rgba(7,193,96,.35)}
.btn-guide{background:#fff;color:var(--ink);border:1.5px solid var(--line)}

/* ========== 顶栏（fixed/sticky，logo 常驻承接） ========== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);animation:fadeDown .5s ease}
.topbar .logo{width:34px;height:34px;border-radius:10px;object-fit:cover;flex:none;background:#f0f2f4}
.topbar b{font-size:16px}
.topbar nav{margin-left:auto;display:flex;gap:8px}
.topbar nav a{padding:7px 14px;border-radius:18px;font-size:13px;color:var(--sub);text-decoration:none;cursor:pointer}
.topbar nav a:active{background:#f0f2f4}
.topbar nav a.buy{background:var(--green);color:#fff;font-weight:700}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.wrap{max-width:620px;margin:0 auto;padding:20px 16px 40px}
.hidden{display:none}

/* 下载栏 */
.section-label{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:1px;margin:20px 4px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dl-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dl-item:last-child{border-bottom:none}
.dl-ico{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:#fff}
.dl-ico.ico-blue{background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:24px}
.dl-info{flex:1;min-width:0}
.dl-info b{font-size:15px}
.dl-info p{font-size:12px;color:var(--sub);margin-top:1px}
.dl-btn{flex:none;background:var(--green);color:#fff;border:none;border-radius:18px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer}
.dl-btn.blue{background:var(--blue)}
.dl-btn:active{opacity:.85}
.tips{font-size:12px;color:var(--sub);background:#f0f6ff;border-radius:10px;padding:9px 12px;margin-top:12px}

/* 观看教程视频 */
.ks-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 18px}
.ks-ico{width:52px;height:52px;object-fit:contain}
.ks-title{font-size:16px;font-weight:700;margin-top:12px}
.ks-sub{font-size:13px;color:var(--sub);margin:4px 0 18px}
.ks-btn{background:#ff5500;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.ks-btn:active{opacity:.85}
.ks-hint{font-size:12px;color:var(--sub);margin-top:12px}

.footer{text-align:center;color:#c2c7cd;font-size:12px;margin-top:28px}
#main{animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ========== 首屏：logo 常驻 + Q弹入场 + 双按钮 ========== -->
<section class="hero" id="hero">
  <img class="logo" src="assets/logo.png" alt="野鸡电竞">
  <div class="cta">
    <button class="btn btn-buy" onclick="location.href='https://pay.futrue.asia'">购买卡密</button>
    <button class="btn btn-guide" onclick="showMain()">查看教程</button>
  </div>
</section>

<!-- ========== 同一画面向下承接：顶栏 + 下载 + 观看视频 ========== -->
<header class="topbar hidden" id="topbar">
  <img class="logo" src="assets/logo.png" alt="野鸡电竞">
  <b>野鸡电竞</b>
  <nav>
    <a onclick="go('#dl')">下载</a>
    <a onclick="go('#video')">教程</a>
    <a class="buy" onclick="location.href='https://pay.futrue.asia'">购卡</a>
  </nav>
</header>

<main class="hidden wrap" id="main">
  <section id="dl">
    <div class="section-label">资源下载</div>
    <div class="card">
      <div class="dl-item">
        <img class="dl-ico" src="assets/shizuku.png" alt="SHIZUKU">
        <div class="dl-info"><b>SHIZUKU</b><p>提权环境，激活后启动器才能注入文件</p></div>
        <button class="dl-btn" onclick="dl('https://futrue.asia/download/shizuku.apk','SHIZUKU')">下载</button>
      </div>
      <div class="dl-item">
        <img class="dl-ico" src="assets/yeji.png" alt="yeji">
        <div class="dl-info"><b>野鸡启动器</b><p>主程序，选游戏、开辅助、管卡密</p></div>
        <button class="dl-btn blue" onclick="dl('https://futrue.asia/download/yeji.apk','启动器')">下载</button>
      </div>
    </div>
    <div class="tips">请优先安装并激活 SHIZUKU，再安装启动器。若 SHIZUKU 已激活，可直接使用启动器。</div>
  </section>

  <section id="video">
    <div class="section-label">观看教程视频</div>
    <div class="card ks-card">
      <img class="ks-ico" src="assets/kuaishou.jpg" alt="链接">
      <div class="ks-title">打开快手观看完整教程</div>
      <div class="ks-sub">点击复制观看链接，打开快手 App 粘贴即可观看</div>
      <button class="ks-btn" id="ksBtn">复制快手观看链接</button>
      <div class="ks-hint">复制后请打开快手 App 粘贴，即可观看视频</div>
    </div>
  </section>

  <div class="footer">野鸡电竞 · 辅助工具 · 下载·教程·购卡</div>
</main>

<script>
// ===== 配置 =====
const DOUYIN_COPY = "https://v.kuaishou.com/Jytqxbr8";
const $ = (id) => document.getElementById(id);

// ---- 入场：logo Q弹动画结束后淡入双按钮（logo 保持显示在首屏）----
window.addEventListener('load', () => {
  setTimeout(() => $('hero').classList.add('show-cta'), 960);
});

// ---- 查看教程：隐藏黑色首屏，切换到全新画面（顶栏+下载+观看视频）----
function showMain() {
  $('hero').style.display = 'none';          // 黑色首屏整个移除，不保留
  $('topbar').classList.remove('hidden');
  $('main').classList.remove('hidden');       // 新画面：顶栏 + 下载 + 视频
  window.scrollTo(0, 0);
}

// ---- 顶栏锚点跳转（避开固定顶栏）----
function go(sel) {
  const el = document.querySelector(sel);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- 下载：blob + APK(zip) 魔数校验 ----
async function dl(url, name) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('请求失败 ' + r.status);
    const b = await r.blob();
    const head = await b.slice(0, 2).arrayBuffer();
    if (new DataView(head).getUint16(0) !== 0x504b) { alert('下载失败：文件校验未通过'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name + '.apk';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) {
    alert('下载失败：' + e.message);
  }
}

// ---- 复制快手观看链接 ----
function copyLink(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return ok;
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => true).catch(fallback);
    return true;
  }
  return fallback();
}
$('ksBtn').addEventListener('click', () => {
  if (copyLink(DOUYIN_COPY)) {
    const b = $('ksBtn'), o = b.textContent;
    b.textContent = '已复制，去快手粘贴观看';
    setTimeout(() => b.textContent = o, 2000);
  }
});
</script>
</body>
</html>
