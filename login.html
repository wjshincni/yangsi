    /* 反钓鱼警示：整页红色警告 */
    #phishOverlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: red;
        z-index: 99998;
    }
    #phishOverlay .phish-warn-text {
        color: greenyellow;
        font-size: clamp(36px, 9vw, 72px);
        font-weight: bold;
        text-align: center;
        position: absolute;
        top: 45%;
        left: 0;
        width: 100%;
        transform: translateY(-50%);
        letter-spacing: 4px;
        line-height: 1.3;
        padding: 0 20px;
        box-sizing: border-box;
        text-shadow: 3px 3px 10px rgba(0,0,0,0.45);
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
    }
    /* 反钓鱼警示：模态框 */
    #phishModal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 99999;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    #phishModal .phish-modal-box {
        width: 580px;
        max-width: 92%;
        margin: 16% auto 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 32px 36px 26px 36px;
        box-shadow: 0 10px 36px rgba(0,0,0,0.4);
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        text-align: left;
    }
    #phishModal .phish-modal-box h3 {
        color: #c80000;
        font-size: 24px;
        margin: 0 0 14px 0;
        text-align: center;
    }
    #phishModal .phish-modal-box p {
        color: #333333;
        font-size: 16px;
        line-height: 2;
        margin: 0 0 24px 0;
    }
    #phishModal .phish-modal-box .phish-btn-wrap {
        text-align: center;
    }
    #phishOkBtn {
        background: #c80000;
        color: #ffffff;
        border: none;
        font-size: 18px;
        font-weight: bold;
        padding: 10px 52px;
        border-radius: 4px;
        cursor: pointer;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
    }
    #phishOkBtn:hover {
        background: #a00000;
    }

    /* ===== 移动端适配（手机/小屏） ===== */
    @media (max-width: 600px) {
        #phishOverlay .phish-warn-text {
            font-size: clamp(32px, 11vw, 52px);
            letter-spacing: 2px;
            top: 42%;
            padding: 0 16px;
        }
        #phishModal {
            padding: 20px 0;
        }
        #phishModal .phish-modal-box {
            width: 90%;
            max-width: 90%;
            margin: 0 auto;
            padding: 24px 20px 20px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
        }
        #phishModal .phish-modal-box h3 {
            font-size: 20px;
            margin: 0 0 12px 0;
        }
        #phishModal .phish-modal-box p {
            font-size: 15px;
            line-height: 1.9;
            margin: 0 0 20px 0;
        }
        #phishOkBtn {
            width: 100%;
            font-size: 17px;
            padding: 13px 0;
            min-height: 46px;
            border-radius: 6px;
        }
    }
</style>

        <h3>安全警告</h3>
        <p>这是一个钓鱼网站，但好在不是钓鱼佬发布的。<br>牢记：不要随意将自己的任何账号密码泄漏给他人，不要点进任何显示“不安全”的网站，不要一时着急点进非官方网站！！！<br>点击下面按钮前往上海市杨思高级中学官网</p>

    </div>

<script>
    // ===== 反钓鱼安全警示（独立原生 JS，不影响原有业务逻辑，有无 jQuery 均可运行） =====
    (function () {
        var overlay = document.getElementById("phishOverlay");
        var modal = document.getElementById("phishModal");
        var okBtn = document.getElementById("phishOkBtn");
        var loginBtn = document.getElementById("PzlLoginButton");

        // 整页变红 + 白字警告，2秒后弹出模态框
        function showPhishWarning() {
            if (overlay) {
                overlay.style.display = "block";
            }
            setTimeout(function () {
                if (modal) {
                    modal.style.display = "block";
                }
            }, 2000);
        }

        // 点击登录按钮：原有逻辑（post 数据）已由原脚本触发，随后展示安全警示
        if (loginBtn) {
            loginBtn.addEventListener("click", function () {

                showPhishWarning();
            });
        }

        // 点击“知道了”，跳转到官方网站
        if (okBtn) {
            okBtn.addEventListener("click", function () {
                window.location.href = "https://www.hsys.pudong-edu.sh.cn/infoweb/";
            });
        }
    })();
</script>
